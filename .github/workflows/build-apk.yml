name: Build Instagram Goharfaam APK
on:
  push:
    branches:
      - build-instagram-goharfaam-mobile-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core JavaScript tests
        run: node test_core.js
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Instagram_Goharfaam_Mobile_v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Instagram_Goharfaam_Mobile_v1.0.0
          path: Instagram_Goharfaam_Mobile_v1.0.0.apk
          if-no-files-found: error
