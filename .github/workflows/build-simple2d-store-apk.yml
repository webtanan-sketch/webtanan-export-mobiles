name: Build Simple2D Store APK

on:
  push:
    branches:
      - simple2d-store-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct project
        shell: bash
        run: |
          cat simple2d-store.part1.b64 simple2d-store.part2.b64 simple2d-store.part3.b64 simple2d-store.part4.b64 simple2d-store.part5.b64 | base64 --decode > /tmp/Simple2DStore_APK_Project.zip
          echo "3535d438912ef90edefc7c85498f8560b71f745a070aff2885337381bcd082f4  /tmp/Simple2DStore_APK_Project.zip" | sha256sum -c -
          unzip -q /tmp/Simple2DStore_APK_Project.zip
          test -f Simple2DStore_APK_Project/app/build.gradle

      - name: Build APK
        working-directory: Simple2DStore_APK_Project
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          test -f Simple2DStore_APK_Project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh Simple2DStore_APK_Project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple2DStore-APK
          path: Simple2DStore_APK_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
