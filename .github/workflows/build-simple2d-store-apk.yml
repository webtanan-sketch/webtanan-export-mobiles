name: Build Simple2D Store Install Fix APK

on:
  push:
    branches:
      - simple2d-store-install-fix
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct project
        shell: bash
        run: |
          cat simple2d-store.part1.b64 simple2d-store.part2.b64 | base64 --decode > /tmp/Simple2DStore_APK_Project.zip
          echo "e33aaa160e80f182142ccd77ea21d87e2e6a9312c9121954fdbf004463c448bb  /tmp/Simple2DStore_APK_Project.zip" | sha256sum -c -
          unzip -q /tmp/Simple2DStore_APK_Project.zip
          test -f Simple2DStore_APK_Project/app/build.gradle

      - name: Build APK
        working-directory: Simple2DStore_APK_Project
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          test -f Simple2DStore_APK_Project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh Simple2DStore_APK_Project/app/build/outputs/apk/debug/app-debug.apk
          unzip -t Simple2DStore_APK_Project/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Simple2DStore_APK_Project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple2DStore-InstallFix-APK
          path: Simple2DStore_APK_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
