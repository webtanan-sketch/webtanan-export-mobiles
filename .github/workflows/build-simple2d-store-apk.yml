name: Build Simple2D Store Install Fix 2 APK

on:
  push:
    branches:
      - simple2d-store-install-fix2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct original verified project
        shell: bash
        run: |
          cat simple2d-store.part1.b64 simple2d-store.part2.b64 simple2d-store.part3.b64 simple2d-store.part4.b64 simple2d-store.part5.b64 | base64 --decode > /tmp/Simple2DStore_APK_Project.zip
          echo "3535d438912ef90edefc7c85498f8560b71f745a070aff2885337381bcd082f4  /tmp/Simple2DStore_APK_Project.zip" | sha256sum -c -
          unzip -q /tmp/Simple2DStore_APK_Project.zip
          test -f Simple2DStore_APK_Project/app/build.gradle

      - name: Apply install compatibility fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Simple2DStore_APK_Project/app/build.gradle')
          s = p.read_text()
          s = s.replace("applicationId 'com.webtanan.simple2dstore'", "applicationId 'com.webtanan.simple2dstore.install2'")
          s = s.replace('versionCode 1', 'versionCode 2')
          s = s.replace("versionName '1.0.0'", "versionName '1.0.1'")
          p.write_text(s)
          m = Path('Simple2DStore_APK_Project/app/src/main/AndroidManifest.xml')
          x = m.read_text()
          x = x.replace('android:label="فروشگاه من"', 'android:label="فروشگاه من 2D"')
          m.write_text(x)
          print(p.read_text())
          PY

      - name: Build APK
        working-directory: Simple2DStore_APK_Project
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=Simple2DStore_APK_Project/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          cp "$APK" Simple2DStore_InstallFix_v1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Simple2DStore-InstallFix-v1.0.1
          path: Simple2DStore_InstallFix_v1.0.1.apk
          if-no-files-found: error
          retention-days: 7
